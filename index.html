<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>AR Postcards</title>
    <script src="./lib/aframe.min.js"></script>
    <script src="./lib/mindar-image-aframe.prod.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #status {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        font-family: sans-serif;
        font-size: 13px;
        border-radius: 20px;
        z-index: 10000;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading configuration...</div>
    
    <script>
      const statusText = document.querySelector('#status');

      // 1. JSON Fetch
      fetch('./postcards.json')
        .then(response => response.json())
        .then(config => {
          if (!config.mindFile || !config.targets || config.targets.length === 0) {
            statusText.innerText = "Invalid configuration in postcards.json";
            statusText.style.background = "rgba(220, 20, 20, 0.9)";
            return;
          }

          statusText.innerText = "Loading AR engine...";

          // 2. Dynamic a-Scene creation after config is fully loaded
          const sceneEl = document.createElement('a-scene');
          sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${config.mindFile}; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; warmupTolerance: 5; uiLoading: no; uiScanning: no;`);
          sceneEl.setAttribute('color-space', 'sRGB');
          sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights: false');
          sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
          sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');

          // Camera functionality
          const cameraEl = document.createElement('a-camera');
          cameraEl.setAttribute('position', '0 0 0');
          cameraEl.setAttribute('look-controls', 'enabled: false');
          sceneEl.appendChild(cameraEl);

          let activeTargetsCount = 0;

          // 3. Target loop and build
          config.targets.forEach(targetConfig => {
            const targetEl = document.createElement('a-entity');
            targetEl.setAttribute('mindar-image-target', `targetIndex: ${targetConfig.targetIndex}`);

            const imageEl = document.createElement('a-image');
            imageEl.setAttribute('src', targetConfig.imageSrc);
            imageEl.setAttribute('position', '0 0 0.01');
            imageEl.setAttribute('rotation', '0 0 0');

            // Calculate target aspect ratio based on output image
            const tempImg = new Image();
            tempImg.crossOrigin = "anonymous";
            tempImg.src = targetConfig.imageSrc;
            tempImg.onload = function() {
              const naturalWidth = tempImg.naturalWidth;
              const naturalHeight = tempImg.naturalHeight;
              if (naturalWidth && naturalHeight) {
                const aspectRatio = naturalWidth / naturalHeight;
                imageEl.setAttribute('width', 1);
                imageEl.setAttribute('height', 1 / aspectRatio);
              }
            };

            targetEl.appendChild(imageEl);
            sceneEl.appendChild(targetEl);

            // Event listeners
            targetEl.addEventListener('targetFound', () => {
              activeTargetsCount++;
              statusText.innerText = "Photo recognised!";
              statusText.style.background = "rgba(0, 180, 80, 0.9)";
            });

            targetEl.addEventListener('targetLost', () => {
              activeTargetsCount = Math.max(0, activeTargetsCount - 1);
              if (activeTargetsCount === 0) {
                statusText.innerText = "Point at a historic photo.";
                statusText.style.background = "rgba(0, 0, 0, 0.75)";
              }
            });
          });

          // Lifecycle listeners
          sceneEl.addEventListener('arReady', () => {
            statusText.innerText = "Camera ready. Point it at a historic photo.";
          });

          sceneEl.addEventListener('arError', () => {
            statusText.innerText = "Failed to initialise camera.";
            statusText.style.background = "rgba(220, 20, 20, 0.9)";
          });

          // A-scene mount
          document.body.appendChild(sceneEl);
        })
        .catch(error => {
          console.error('Error loading postcards.json:', error);
          statusText.innerText = "Failed to load configuration file.";
          statusText.style.background = "rgba(220, 20, 20, 0.9)";
        });
    </script>
  </body>
</html>
